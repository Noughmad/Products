# See https://pre-commit.com for more information
# Exclude the BOSL2 submodule directory from all hooks
exclude: '^BOSL2/'

repos:
  - repo: local
    hooks:
      - id: scadformat
        name: scadformat
        entry: bash -c 'for f in "$@"; do scadformat "$f" && rm -f "${f}.scadbak"; done' --
        language: system
        types: [file]
        types_or: []
        files: '\.scad$'
        exclude: '^BOSL2/'
